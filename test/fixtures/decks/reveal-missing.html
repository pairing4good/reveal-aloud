<!DOCTYPE html>
<!--
  Shaped like a deck, but its reveal.js never loads — a vendored copy at a path that does not
  exist, which is what an offline deck moved to a new machine looks like.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" /><title>Looks Like A Deck</title>
    <script src="vendor/reveal-that-is-not-here.js"></script>
  </head>
  <body>
    <div class="reveal"><div class="slides">
      <section>One<aside class="notes">Hello there.</aside></section>
      <section>Two<aside class="notes">And again.</aside></section>
    </div></div>
  </body>
</html>
